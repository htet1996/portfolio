<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d15"/>
      <stop offset="1" stop-color="#11131d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c5cfc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#7c5cfc" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c5cfc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- terminal dots -->
  <g transform="translate(80,90)">
    <circle cx="0" cy="0" r="9" fill="#ff5f56"/>
    <circle cx="28" cy="0" r="9" fill="#ffbd2e"/>
    <circle cx="56" cy="0" r="9" fill="#27c93f"/>
    <text x="92" y="6" font-family="'JetBrains Mono', monospace" font-size="22" fill="#5a6072">nikko@neo: ~/portfolio</text>
  </g>

  <text x="80" y="280" font-family="'JetBrains Mono', monospace" font-size="26" fill="#7c5cfc" letter-spacing="6">FULL STACK DEVELOPER · MYANMAR</text>

  <text x="76" y="400" font-family="Inter, system-ui, sans-serif" font-size="116" font-weight="800" fill="url(#accent)">Htet Min Paing</text>

  <text x="80" y="470" font-family="Inter, system-ui, sans-serif" font-size="34" fill="#8b93a7">Building AI products for the Myanmar market 🇲🇲</text>

  <!-- chips -->
  <g font-family="'JetBrains Mono', monospace" font-size="22" fill="#e8ecf4">
    <g transform="translate(80,520)">
      <rect width="140" height="48" rx="10" fill="#13151f" stroke="#4f8cff" stroke-opacity="0.3"/>
      <text x="70" y="31" text-anchor="middle">Next.js</text>
    </g>
    <g transform="translate(236,520)">
      <rect width="130" height="48" rx="10" fill="#13151f" stroke="#4f8cff" stroke-opacity="0.3"/>
      <text x="65" y="31" text-anchor="middle">Python</text>
    </g>
    <g transform="translate(382,520)">
      <rect width="120" height="48" rx="10" fill="#13151f" stroke="#4f8cff" stroke-opacity="0.3"/>
      <text x="60" y="31" text-anchor="middle">React</text>
    </g>
    <g transform="translate(518,520)">
      <rect width="170" height="48" rx="10" fill="#13151f" stroke="#4f8cff" stroke-opacity="0.3"/>
      <text x="85" y="31" text-anchor="middle">SagaNote AI</text>
    </g>
  </g>

  <!-- big N monogram -->
  <g transform="translate(980,180)">
    <rect width="180" height="180" rx="36" fill="#0b0d15" stroke="url(#accent)" stroke-width="3" stroke-opacity="0.6"/>
    <text x="90" y="132" font-family="'JetBrains Mono', monospace" font-size="120" font-weight="700" text-anchor="middle" fill="url(#accent)">N</text>
  </g>
</svg>
